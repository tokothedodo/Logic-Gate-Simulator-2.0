name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to release, e.g. v2.0.0'
        required: true
        type: string

jobs:
  bundle:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux AppImage
            os: ubuntu-22.04
            bundles: appimage
          - label: Windows installer
            os: windows-latest
            bundles: nsis
          - label: macOS app
            os: macos-latest
            bundles: app,dmg

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.bundles }}
          
      - name: Install Linux Rust target
        if: matrix.os == 'ubuntu-22.04'
        run: rustup target add x86_64-unknown-linux-gnu     
      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            patchelf

      - name: Bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: Logic Gate Simulator ${{ inputs.tag || github.ref_name }}
          releaseBody: |
            Desktop builds of Logic Gate Simulator 2.0.
            See the README for supported file formats.
          releaseDraft: true
          prerelease: false
          args: --bundles ${{ matrix.bundles }}

  checks:
    name: Types and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
